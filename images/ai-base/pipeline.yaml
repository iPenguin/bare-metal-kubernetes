# Builds images/ai-base and pushes it to Harbor.
# Rebuilds on Dockerfile changes, when nvidia publishes a new base image, and weekly for OS patches.
#
# Requires a Harbor robot account with push access, stored for the concourse main team:
#   kubectl -n concourse-main create secret generic harbor \
#     --from-literal=username='robot$concourse' --from-literal=password='<token>'
#
# Set with:
#   fly -t homelab set-pipeline -p ai-base -c images/ai-base/pipeline.yaml
---
resources:
  - name: source
    type: git
    icon: git
    source:
      uri: https://github.com/ipenguin/bare-metal-kubernetes.git
      branch: master
      paths:
        - images/ai-base

  - name: base-image
    type: registry-image
    icon: docker
    check_every: 24h
    source:
      repository: nvidia/cuda
      tag: 12.8.1-base-ubuntu24.04

  - name: weekly
    type: time
    icon: clock-outline
    source:
      interval: 168h

  - name: ai-base
    type: registry-image
    icon: docker
    source:
      repository: harbor.clt.milco.casa/homelab/ai-base
      tag: latest
      username: ((harbor.username))
      password: ((harbor.password))

jobs:
  - name: build
    plan:
      - in_parallel:
          - get: source
            trigger: true
          - get: base-image
            trigger: true
            params:
              format: oci
          - get: weekly
            trigger: true

      - task: build-image
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
          inputs:
            - name: source
            - name: base-image
          outputs:
            - name: image
          params:
            CONTEXT: source/images/ai-base
            IMAGE_ARG_BASE_IMAGE: base-image/image.tar
          run:
            path: build

      # dated tag alongside latest so deployments can pin a known-good build
      - task: date-tag
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: busybox
          outputs:
            - name: tags
          run:
            path: sh
            args: ["-c", "date +%Y%m%d > tags/tags"]

      - put: ai-base
        params:
          image: image/image.tar
          additional_tags: tags/tags
