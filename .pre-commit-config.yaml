---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0  # pragma: allowlist secret
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: '\.j2$'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: (^|/)hosts/group_vars/all/apps\.yaml$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
        exclude: requirements-ci\.lock$
      - id: trailing-whitespace
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # frozen: v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: no-home-paths
        name: no absolute home-directory paths
        language: pygrep
        entry: /hom[e]/
