- name: Ceph admin functions
  when:
    - inventory_hostname in k8s_controller
  block:
    - name: Add rook helm repo
      kubernetes.core.helm_repository:
        name: rook-release
        url: https://charts.rook.io/release
        state: present

    - name: Deploy Rook Operator Helm chart
      kubernetes.core.helm:
        name: rook-ceph
        kubeconfig: /etc/kubernetes/admin.conf
        chart_ref: rook-release/rook-ceph
        chart_version: "{{ rook_version }}"
        namespace: "{{ rook_namespace }}"
        create_namespace: true
        values: "{{ lookup('template', 'rook-ceph.yaml.j2') | from_yaml }}"
        update_repo_cache: true
        state: present

    - name: Deploy Rook Cluster Helm chart
      kubernetes.core.helm:
        name: rook-ceph-cluster
        kubeconfig: /etc/kubernetes/admin.conf
        chart_ref: rook-release/rook-ceph-cluster
        chart_version: "{{ rook_version }}"
        namespace: "{{ rook_namespace }}"
        values: "{{ lookup('template', 'rook-cluster.yaml.j2') | from_yaml }}"
        update_repo_cache: true
        state: present

    - name: Copy reset script to controller
      ansible.builtin.template:
        src: ceph-reset.sh.j2
        dest: /root/ceph-reset.sh
        owner: root
        group: root
        mode: 0700

    # the dashboard serves a self-signed cert, so Traefik skips verifying it
    - name: Create Traefik ServersTransport for the Ceph dashboard
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: ceph-dashboard
            namespace: "{{ rook_namespace }}"
          spec:
            insecureSkipVerify: true

    # an IngressRoute, because Traefik only reads the serverstransport annotation
    # from a Service and Rook owns the dashboard Service
    - name: Expose the Ceph dashboard through Traefik
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: ceph-dashboard
            namespace: "{{ rook_namespace }}"
          spec:
            entryPoints:
              - websecure
            routes:
              - match: "Host(`ceph.{{ lan_domain }}`)"
                kind: Rule
                services:
                  - name: rook-ceph-mgr-dashboard
                    port: 8443
                    scheme: https
                    serversTransport: ceph-dashboard
            tls: {}
...
