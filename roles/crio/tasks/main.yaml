---

- name: Add GPG Key
  ansible.builtin.apt_key:
    url: https://dl.k8s.io/apt/doc/apt-key.gpg
    state: present

- name: Remove files containing 'cri_o' in /etc/apt/sources.list.d
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*cri_o*'
    recurse: no
  register: cri_o_files

- name: Delete found files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ cri_o_files.files }}"

- name: Add crio signing key
  ansible.builtin.get_url:
    url: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version[:4] }}/deb/Release.key
    dest: /etc/apt/trusted.gpg.d/crio.asc
    mode: '0644'
    force: true

- name: Add cri-o repo
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/trusted.gpg.d/crio.asc] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_version[:4] }}/deb/ /
    state: present

- name: Download k8s gpg keys
  ansible.builtin.uri:
    url: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0:2] | join('.') }}/deb/Release.key
    dest: /etc/apt/trusted.gpg.d/kubernetes-apt-keyring.asc
    status_code:
      - 200
      - 304

- name: Configure k8s repo - needed for cri-o tools
  ansible.builtin.blockinfile:
    path: /etc/apt/sources.list.d/kubernetes.list
    block: |
      deb [signed-by=/etc/apt/trusted.gpg.d/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0:2] | join('.') }}/deb/ /
    create: yes
    state: present

- name: Install cri-o packages
  ansible.builtin.apt:
    name:
      - cri-o={{ crio_version }}-*
      - cri-tools
      - runc
    allow_change_held_packages: yes
    state: latest
    update_cache: yes
  become: yes

- name: Lock cri-o from updates
  ansible.builtin.dpkg_selections:
    name: '{{ item }}'
    selection: hold
  loop:
    - cri-o
    - cri-tools

- name: Ensure container path
  ansible.builtin.file:
    path: /etc/containers
    owner: root
    group: root
    mode: 0755
    state: directory

- name: Ensure additional container registry configuration is absent
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: absent

- name: Configure container policy
  ansible.builtin.template:
    src: policy.json
    dest: /etc/containers/policy.json
    owner: root
    group: root
    mode: 0640

- name: Configure docker auth
  ansible.builtin.template:
    src: auth.json
    dest: /etc/containers/auth.json
    owner: root
    group: root
    mode: 0600

- name: Configure docker registries
  ansible.builtin.template:
    src: registries.conf
    dest: /etc/containers/registries.conf
    owner: root
    group: root
    mode: 0640


- name: Configure CRI-O to use auth
  ansible.builtin.template:
    src: 10-crio.conf
    dest: /etc/crio/crio.conf.d/10-crio.conf
    owner: root
    group: root
    mode: 0640
  notify: Restart CRI-O

- name: Link common binary
  ansible.builtin.file:
    src: /usr/libexec/crio/conmon
    dest: /usr/local/bin/conmon
    state: link

- name: Enable cri-o service
  ansible.builtin.systemd:
    enabled: yes
    state: started
    name: crio

# Restart (if notified) before removing stray binaries so CRI-O never
# briefly points at a path we are about to delete.
- name: Apply pending CRI-O restarts before stray crun cleanup
  ansible.builtin.meta: flush_handlers

- name: Remove stray standalone crun from /usr/local/bin
  ansible.builtin.file:
    path: /usr/local/bin/crun
    state: absent

# dpkg -S rc!=0 means the path is not owned by any package (or is missing).
# check_mode: false so --check still learns ownership before deciding to remove.
- name: Check whether /usr/bin/crun is owned by a dpkg package
  ansible.builtin.command:
    cmd: dpkg -S /usr/bin/crun
  register: crun_usr_bin_dpkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove stray non-package /usr/bin/crun
  ansible.builtin.file:
    path: /usr/bin/crun
    state: absent
  when: crun_usr_bin_dpkg.rc != 0
...
