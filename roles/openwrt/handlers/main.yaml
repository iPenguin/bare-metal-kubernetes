---

- name: Restart acme
  community.general.openwrt_init:
    name: acme
    state: restarted

- name: Restart ddns
  community.general.openwrt_init:
    name: ddns
    state: restarted

- name: Restart dnsmasq
  community.general.openwrt_init:
    name: dnsmasq
    state: restarted

- name: Restart firewall
  community.general.openwrt_init:
    name: firewall
    state: restarted

- name: Reload network
  community.general.openwrt_init:
    name: network
    state: reloaded

- name: Restart rpcd
  community.general.openwrt_init:
    name: rpcd
    state: restarted

- name: Restart uhttpd
  community.general.openwrt_init:
    name: uhttpd
    state: restarted
