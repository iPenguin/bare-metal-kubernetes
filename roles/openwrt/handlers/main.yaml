---

- name: restart acme
  community.general.openwrt_init:
    name: acme
    state: restarted

- name: restart ddns
  community.general.openwrt_init:
    name: ddns
    state: restarted

- name: restart dnsmasq
  community.general.openwrt_init:
    name: dnsmasq
    state: restarted

- name: restart firewall
  community.general.openwrt_init:
    name: firewall
    state: restarted

- name: reload network
  community.general.openwrt_init:
    name: network
    state: reloaded

- name: restart rpcd
  community.general.openwrt_init:
    name: rpcd
    state: restarted

- name: restart uhttpd
  community.general.openwrt_init:
    name: uhttpd
    state: restarted
