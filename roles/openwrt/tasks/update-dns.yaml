---

- name: Install desired packages
  ansible.builtin.apk:
    name: luci-compat,luci-lib-ipkg,luci-mod-rpc
    state: present
    update_cache: true

- name: Configure rpcd logins
  ansible.builtin.template:
    src: rpcd.j2
    dest: /etc/config/rpcd
    owner: root
    group: root
    mode: "0600"
  diff: false  # keeps the password hash out of --diff output
  notify: Restart rpcd

- name: Ensure rpcd ACL directory exists
  ansible.builtin.file:
    path: /usr/share/rpcd/acl.d
    state: directory
    mode: "0755"

- name: Configure rpcd ACL for luci-dns
  ansible.builtin.copy:
    dest: /usr/share/rpcd/acl.d/luci-dns.json
    content: |
      {
        "luci-dns": {
          "description": "External-DNS LuCI RPC access",
          "read": {
            "ubus": {
              "uci": ["get", "changes"],
              "session": ["login", "access"]
            },
            "uci": {
              "dhcp": ["*"]
            }
          },
          "write": {
            "ubus": {
              "uci": ["set", "delete", "add", "commit", "revert"]
            },
            "uci": {
              "dhcp": ["*"]
            }
          }
        }
      }
    mode: "0644"
  notify: Restart rpcd

- name: Ensure rpcd is running
  ansible.builtin.service:
    name: rpcd
    state: started
    enabled: true
