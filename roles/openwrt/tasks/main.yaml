
- name: Update package list
  ansible.builtin.raw: apk update

# Cannot use ansible.builtin.opkg until python is installed.
# python3-multiprocessing python3-distutils python3-logging
# python3-urllib
- name: Install required packages for ansible on OpenWrt
  ansible.builtin.raw: |-
    apk add {{ item }}
  loop:
    - openssh-sftp-server
    - coreutils-base64
    - python3
    - python3-multiprocessing
    - python3-logging
    - python3-urllib
  tags:
    - ansible
    - packages

- name: Update networking
  import_tasks: update-networking.yaml
  tags:
    - networking
    - wireguard

- name: Update firewall
  import_tasks: update-firewall.yaml
  tags:
    - firewall
    - wireguard

- name: Update dns
  include_tasks: update-dns.yaml
  tags:
    - dns

- name: Update clt.milco.casa glue DNS records
  include_tasks: update-clt-dns.yaml
  tags:
    - dns
    - clt-dns

- name: Update hosts
  include_tasks: update-hosts.yaml
  tags:
    - dhcp
    - hosts

- name: Update inventories
  include_tasks: update-inventories.yaml
  tags:
    - inventories

- name: Update DDNS
  include_tasks: update-ddns.yaml
  tags:
    - ddns

- name: Update ssl-certs
  include_tasks: update-acme.yaml
  tags:
    - ssl
    - acme

- name: Update uhttpd config
  include_tasks: update-uhttpd.yaml
  tags:
    - http
    - uhttpd
