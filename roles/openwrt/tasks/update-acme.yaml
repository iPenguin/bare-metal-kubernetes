---

- name: Install desired packages
  ansible.builtin.apk:
    name: acme-acmesh,acme-acmesh-dnsapi,luci-app-acme
    state: present
    update_cache: true

- name: Configure acme
  ansible.builtin.template:
    src: acme.j2
    dest: /etc/config/acme
    owner: root
    group: root
    mode: "0600"
  notify: Restart acme
