---
# handlers file for kubernetes

- name: Restart sysctl
  ansible.builtin.service:
    name: sysctl
    state: restarted

- name: Restart ubuntu sysctl
  ansible.builtin.service:
    name: systemd-sysctl
    state: restarted

- name: Restart networking
  ansible.builtin.service:
    name: systemd-networkd
    state: restarted
