---
# tasks file for kubernetes master

- name: Populate service facts
  service_facts:

- name: Install apt packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
    state: present

- name: Download k8s gpg keys
  ansible.builtin.uri:
    url: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0:2] | join('.') }}/deb/Release.key
    dest: /etc/apt/trusted.gpg.d/kubernetes-apt-keyring.asc
    status_code:
      - 200
      - 304

- name: Configure k8s repo
  ansible.builtin.blockinfile:
    path: /etc/apt/sources.list.d/kubernetes.list
    block: |
      deb [signed-by=/etc/apt/trusted.gpg.d/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version.split('.')[0:2] | join('.') }}/deb/ /
    create: true
    state: present

- name: Install kubectl kubeadm and kubelet
  ansible.builtin.apt:
    name:
      - kubeadm={{ kubernetes_version }}-*
      - kubectl={{ kubernetes_version }}-*
      - kubelet={{ kubernetes_version }}-*
    allow_change_held_packages: true
    state: present
    update_cache: true

- name: Mark hold updates on k8s packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubectl
    - kubelet
#
# If the firewall is enabled you may see the following issue:
# Everything in the cluster looks like it's working, but you cannot
# connect to services backed by pods, or the pods themselves on the
# node(s) with the firewall running.
#
- name: Disable firewall
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: false
  when: "'ufw' in ansible_facts.services"
