---
- name: Add ansible user
  user:
    name: "{{ item.user }}"
    shell: /bin/bash
    state: present
- name: Add the current users ssh pub key to remote hosts
  authorized_key:
    user: "{{ item.user }}"
    key: "{{ lookup('file', item.ssh_pub_key) }}"
    state: present
- name: Configure sudo
  copy:
    content: "{{ item.user }} ALL=(ALL) NOPASSWD: ALL"
    dest: /etc/sudoers.d/{{ item.user }}
    mode: "0440"
    validate: "visudo -cf %s"
