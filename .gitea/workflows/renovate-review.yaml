# Rates Renovate PRs after pr-checks and keeps one sticky comment per PR.
# workflow_run always runs this file from master, so a PR can't change the
# review logic, and the script is cloned from master too. PR content is only
# read from the API as data. scripts/renovate_review.py is the real gate; the
# `if:` only saves runner time. See docs/apps.md (Renovate review).
#
# Needs repo Actions secret SVC_GROKBOT_TOKEN (svc_grokbot token) and repo
# variable REVIEW_MODE: off (default, also when unset) | comment.
# approve and fix are not enabled yet.
---
name: renovate-review

on:
  workflow_run:
    workflows:
      - pr-checks
    types:
      - completed
  # daily sweep for missed events, 9:00 ET (EST)
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty reviews every open renovate/* PR)
        required: false

concurrency:
  group: renovate-review
  cancel-in-progress: false

# The clone is anonymous; the job token is not used.
permissions: {}

jobs:
  review:
    # Gitea leaves workflow_run.head_branch empty for pull_request runs
    # (refs/pull/N/head), so match the PR head ref instead (run 495 skipped).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login == 'svc_renovate' &&
       startsWith(github.event.workflow_run.pull_requests[0].head.ref, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The default runner shares a writable /opt/hostedtoolcache across jobs,
    # so this token-holding job takes python from a digest-pinned image, not
    # setup-python. The image has git but no node, so actions/checkout can't
    # run in it; clone master instead (public repo, no credentials).
    container: docker.io/library/python:3.12.16-trixie@sha256:9dd21fafb95870b99f9faa703a947d08feeb673048ad556e92ce503d0c086a95
    steps:
      - name: Clone master
        run: >-
          git clone --quiet --depth 1 --branch master --no-tags
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
      # The script reads the PR number or head SHA from the event file
      # itself, so no PR field is interpolated here.
      - name: Review
        working-directory: src
        env:
          GITEA_TOKEN_BOT: ${{ secrets.SVC_GROKBOT_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE }}
        run: /usr/local/bin/python3 scripts/renovate_review.py
