---

# Run-once playbook for section D of docs/openbao-bootstrap.md:
# initialize Pi-OpenBao, unseal it, enable the Transit autounseal key,
# and mint the autounseal token for the cluster.
#
# Idempotent: if OpenBao is already initialized, the playbook skips
# init and only reconciles the transit engine, the autounseal key, and the
# autounseal policy (those need a root token from the vault).
#
# Captured secrets from a first run (root token, 5 unseal keys, autounseal
# token) are written to .openbao-pi-init.json on the control node and then
# encrypted into vaults/group_vars/all/openbao_generated.yaml. If a run dies
# after init (for example the encrypt step), re-run it: it resumes from the
# capture file instead of re-initializing.
#
# Usage:
#   ansible-playbook openbao-pi-init.yaml --tags openbao-pi-init

- name: Initialize Pi-OpenBao
  hosts: openbao
  become: true
  gather_facts: false
  tags:
    - never
    - openbao-pi-init
  vars:
    openbao_pi_init_output: "{{ playbook_dir }}/.openbao-pi-init.json"
    # Talk to the local TLS listener on loopback. Skip CA verification
    # because the CA cert may not have been deployed to the Pi yet (the
    # openbao-pi role only writes it once vault_openbao_internal_ca_cert
    # is populated). Loopback + root means there is no MITM exposure here.
    _bao_env:
      BAO_ADDR: "https://127.0.0.1:8200"
      BAO_SKIP_VERIFY: "true"

  pre_tasks:
    - name: Check for an existing capture file
      ansible.builtin.stat:
        path: "{{ openbao_pi_init_output }}"
      register: _init_capture
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Check whether the encrypted secrets file already exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vaults/group_vars/all/openbao_generated.yaml"
      register: _generated_file
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Read the existing capture file (resume after a failed run)
      ansible.builtin.slurp:
        src: "{{ openbao_pi_init_output }}"
      register: _init_capture_content
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: _init_capture.stat.exists
      no_log: true

    - name: Confirm openbao.service is active
      ansible.builtin.command: systemctl is-active openbao.service
      register: _bao_service_state
      changed_when: false

    # The unit is Type=notify; older bao binaries never send READY=1, so
    # systemd may sit in "activating" forever even though the TLS listener
    # is bound. Treat "activating" as acceptable here and let the wait_for
    # task below be the authoritative gate on the API actually answering.
    - name: Fail clearly if openbao.service is not running
      ansible.builtin.fail:
        msg: >-
          openbao.service on {{ inventory_hostname }} is "{{ _bao_service_state.stdout }}".
          The service must be up before we can initialize. Run section C of
          the runbook first:
            ansible-playbook run.yaml --tags openbao-pi
          Then check `journalctl -u openbao.service` if it still will not
          start.
      when: _bao_service_state.stdout not in ['active', 'activating']

    - name: Wait for the OpenBao listener to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8200
        timeout: 30

    - name: Check current OpenBao status
      ansible.builtin.command: /usr/local/bin/bao status -format=json
      environment: "{{ _bao_env }}"
      register: _bao_status_raw
      changed_when: false
      # bao status exits 0 when unsealed, 2 when sealed (or uninitialized),
      # 1 only on a real error. Both 0 and 2 still produce valid JSON.
      failed_when: _bao_status_raw.rc not in [0, 2]

    - name: Parse OpenBao status
      ansible.builtin.set_fact:
        _bao_status: "{{ _bao_status_raw.stdout | from_json }}"

    - name: Refuse a capture file that does not match this OpenBao
      ansible.builtin.fail:
        msg: >-
          {{ openbao_pi_init_output }} exists but OpenBao is not initialized,
          so the file is stale. Move it aside before re-running.
      when: _init_capture.stat.exists and not _bao_status.initialized

    - name: Split the capture file into init output and autounseal token
      ansible.builtin.set_fact:
        _cap_parts: "{{ (_init_capture_content.content | b64decode).split('---') if _init_capture.stat.exists else [''] }}"
      no_log: true

  tasks:
    - name: Initialize OpenBao (5 shares, threshold 3)
      ansible.builtin.command: >-
        /usr/local/bin/bao operator init
        -key-shares=5
        -key-threshold=3
        -format=json
      environment: "{{ _bao_env }}"
      register: _bao_init_raw
      when: not _bao_status.initialized
      no_log: true

    - name: Persist captured init material to control node
      ansible.builtin.copy:
        content: "{{ _bao_init_raw.stdout }}"
        dest: "{{ openbao_pi_init_output }}"
        mode: "0600"
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: not _bao_status.initialized
      no_log: true

    # set_fact turns JSON-looking strings into dicts, so parse once, here.
    - name: Parse init output (fresh or from the capture file)
      ansible.builtin.set_fact:
        _bao_init: "{{ (_bao_init_raw.stdout if _bao_init_raw.stdout is defined else (_cap_parts[0] | trim)) | from_json }}"
      when: not _bao_status.initialized or _init_capture.stat.exists
      no_log: true

    - name: Unseal OpenBao with the first 3 captured keys
      ansible.builtin.command: >-
        /usr/local/bin/bao operator unseal {{ item }}
      environment: "{{ _bao_env }}"
      loop: "{{ _bao_init.unseal_keys_b64[:3] }}"
      when: _bao_init is defined and _bao_status.sealed
      no_log: true

    - name: Unseal OpenBao with stored keys (re-run against sealed instance)
      ansible.builtin.command: >-
        /usr/local/bin/bao operator unseal {{ item }}
      environment: "{{ _bao_env }}"
      loop: "{{ (vault_openbao_pi_unseal_keys.splitlines() | reject('equalto', '') | list)[:3] }}"
      when:
        - _bao_init is not defined
        - _bao_status.sealed
        - vault_openbao_pi_unseal_keys is string
        - vault_openbao_pi_unseal_keys | length > 0
        - vault_openbao_pi_unseal_keys != 'REPLACE_ME'
      no_log: true

    - name: Refresh status after potential init/unseal
      ansible.builtin.command: /usr/local/bin/bao status -format=json
      environment: "{{ _bao_env }}"
      register: _bao_status_raw
      changed_when: false
      failed_when: _bao_status_raw.rc not in [0, 2]

    - name: Re-parse status
      ansible.builtin.set_fact:
        _bao_status: "{{ _bao_status_raw.stdout | from_json }}"

    - name: Fail if OpenBao is still sealed
      ansible.builtin.fail:
        msg: >-
          OpenBao is initialized but still sealed. Cannot configure transit.
          Unseal manually (or fix vault_openbao_pi_unseal_keys and run the
          openbao-pi role) and re-run this playbook.
      when: _bao_status.sealed

    - name: Pick the root token for the rest of the play
      ansible.builtin.set_fact:
        _bao_root_token: "{{ _bao_init.root_token if _bao_init is defined else (vault_openbao_pi_root_token | default('')) }}"
      no_log: true

    - name: Require a root token for transit reconciliation
      ansible.builtin.fail:
        msg: >-
          OpenBao is already initialized but vault_openbao_pi_root_token is
          not set in the vault. Transit + policy reconciliation needs a
          root-equivalent token. Either set the variable in
          vaults/group_vars/all/openbao.yaml, or pass --extra-vars to
          override.
      when: _bao_root_token | length == 0

    - name: List enabled secrets engines
      ansible.builtin.command: /usr/local/bin/bao secrets list -format=json
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      register: _bao_secrets_raw
      changed_when: false
      no_log: true

    - name: Enable transit secrets engine
      ansible.builtin.command: /usr/local/bin/bao secrets enable transit
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      when: "'transit/' not in (_bao_secrets_raw.stdout | from_json)"

    - name: List existing transit keys
      ansible.builtin.command: /usr/local/bin/bao list -format=json transit/keys
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      register: _bao_transit_keys_raw
      changed_when: false

    - name: Create the autounseal transit key
      ansible.builtin.command: >-
        /usr/local/bin/bao write -f transit/keys/{{ openbao_pi_transit_key }}
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      when: >-
        _bao_transit_keys_raw.rc != 0
        or openbao_pi_transit_key not in (_bao_transit_keys_raw.stdout | from_json)

    - name: Render autounseal policy
      ansible.builtin.copy:
        dest: /tmp/autounseal.hcl
        mode: "0600"
        content: |
          path "transit/encrypt/{{ openbao_pi_transit_key }}" {
            capabilities = ["update"]
          }
          path "transit/decrypt/{{ openbao_pi_transit_key }}" {
            capabilities = ["update"]
          }

    - name: Install autounseal policy
      ansible.builtin.command: >-
        /usr/local/bin/bao policy write autounseal /tmp/autounseal.hcl
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      changed_when: true

    - name: Remove temporary policy file
      ansible.builtin.file:
        path: /tmp/autounseal.hcl
        state: absent

    - name: Mint the cluster autounseal token (first run only)
      ansible.builtin.command: >-
        /usr/local/bin/bao token create
        -policy=autounseal
        -orphan
        -period=24h
        -display-name=cluster-autounseal
        -format=json
      environment: "{{ _bao_env | combine({'BAO_TOKEN': _bao_root_token}) }}"
      register: _bao_autounseal_token_raw
      when: _bao_init is defined and ((_cap_parts[1:] + [''])[0] | trim | length == 0)
      no_log: true

    - name: Append autounseal token to capture file
      ansible.builtin.copy:
        content: |
          {{ _bao_init | to_json }}
          ---
          {{ _bao_autounseal_token_raw.stdout | from_json | to_json }}
        dest: "{{ openbao_pi_init_output }}"
        mode: "0600"
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: _bao_autounseal_token_raw.stdout is defined
      no_log: true

    - name: Pick the autounseal token (fresh or from the capture file)
      ansible.builtin.set_fact:
        _bao_token: "{{ (_bao_autounseal_token_raw.stdout if _bao_autounseal_token_raw.stdout is defined else ((_cap_parts[1:] + [''])[0] | trim)) | from_json }}"
      when: _bao_init is defined
      no_log: true

    # ---- Auto-persist Pi secrets to vaults/group_vars/all/openbao_generated.yaml ----
    # Uses ansible-vault encrypt_string so the generated file is safe to commit.
    # The file sorts after openbao.yaml (underscore > period in ASCII) so these
    # values override the REPLACE_ME placeholders at runtime.

    - name: Encrypt vault_openbao_pi_unseal_keys
      ansible.builtin.shell: |
        printf '%s' "$PLAINTEXT" |
        ansible-vault encrypt_string \
          --stdin-name vault_openbao_pi_unseal_keys
      environment:
        PLAINTEXT: "{{ _bao_init.unseal_keys_b64 | join('\n') }}"
      register: _enc_unseal_keys
      when: _bao_init is defined and not _generated_file.stat.exists
      changed_when: true
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Encrypt vault_openbao_pi_root_token
      ansible.builtin.shell: |
        printf '%s' "$PLAINTEXT" |
        ansible-vault encrypt_string \
          --stdin-name vault_openbao_pi_root_token
      environment:
        PLAINTEXT: "{{ _bao_init.root_token }}"
      register: _enc_pi_root_token
      when: _bao_init is defined and not _generated_file.stat.exists
      changed_when: true
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Encrypt vault_openbao_pi_autounseal_token
      ansible.builtin.shell: |
        printf '%s' "$PLAINTEXT" |
        ansible-vault encrypt_string \
          --stdin-name vault_openbao_pi_autounseal_token
      environment:
        PLAINTEXT: "{{ _bao_token.auth.client_token }}"
      register: _enc_autounseal_token
      when: _bao_init is defined and not _generated_file.stat.exists
      changed_when: true
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Write Pi secrets to openbao_generated.yaml
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by openbao-pi-init.yaml — do not edit manually.
          # Cluster init secrets will be appended by openbao-cluster-init.yaml.
          {{ _enc_unseal_keys.stdout | regex_replace('\nEncryption successful\n?$', '') }}

          {{ _enc_pi_root_token.stdout | regex_replace('\nEncryption successful\n?$', '') }}

          {{ _enc_autounseal_token.stdout | regex_replace('\nEncryption successful\n?$', '') }}
        dest: "{{ playbook_dir }}/vaults/group_vars/all/openbao_generated.yaml"
        mode: "0600"
      when: _bao_init is defined and not _generated_file.stat.exists
      no_log: true
      connection: local
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Report next steps after a fresh init
      ansible.builtin.debug:
        msg:
          - "Pi-OpenBao is initialized and unsealed."
          - "Secrets encrypted and written to: vaults/group_vars/all/openbao_generated.yaml"
          - "Raw capture also in: {{ openbao_pi_init_output }}"
          - "Next: run section F (ansible-playbook run.yaml --tags openbao-pi)"
          - "Then deploy the cluster: ansible-playbook run.yaml --tags openbao"
          - "Then init the cluster: ansible-playbook openbao-cluster-init.yaml --tags openbao-cluster-init"
      when: _bao_init is defined

    - name: Report no-op
      ansible.builtin.debug:
        msg: >-
          OpenBao was already initialized; transit engine, autounseal key,
          and autounseal policy reconciled. No new init material captured.
      when: _bao_init is not defined
