---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-postgresql
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-postgresql
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/gitea/gitea-postgresql
