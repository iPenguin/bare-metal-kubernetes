# SSH commit-signing key for Gitea, mounted at /etc/gitea-signing (values.yaml).
# Keys: privateKey (OpenSSH, no passphrase), publicKey (.pub line), email.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-signing-key
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/gitea/gitea-signing-key
