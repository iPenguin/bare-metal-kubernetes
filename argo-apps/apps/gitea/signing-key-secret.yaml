# SSH commit-signing key for Gitea, mounted at /etc/gitea-signing (values.yaml).
# Keys: privateKey (OpenSSH, no passphrase), publicKey (.pub line), email.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-signing-key
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-signing-key
    creationPolicy: Owner
    # ssh-keygen rejects a private key without a trailing newline,
    # which OpenBao's UI drops.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        privateKey: "{{ .privateKey | trim }}\n"
  dataFrom:
    - extract:
        key: apps/gitea/gitea-signing-key
