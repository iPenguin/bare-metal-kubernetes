# Registration token for the gitea-actions-build runner (actions-build-values.yaml).
# Repo-scoped, so Gitea has to mint it: homelab/bare-metal-kubernetes > Settings >
# Actions > Runners > Create new runner. Store it in OpenBao as
# kv/apps/gitea/gitea-runner-build-token, key `token`. It is only used to
# register; the runner keeps its credentials in .runner on its PVC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-build-token
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-runner-build-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/gitea/gitea-runner-build-token
