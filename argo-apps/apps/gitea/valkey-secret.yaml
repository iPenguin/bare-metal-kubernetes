---
# Live Secret is currently helm-generated as gitea-valkey / valkey-password.
# After this ExternalSecret owns that name, the valkey subchart uses it via
# auth.existingSecret and Gitea cache/session/queue read CONN_STR.
# CONN_STR matches the parent chart's valkey.dns helper (release gitea,
# clusterDomain cluster.local, port 6379).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-valkey
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-valkey
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        valkey-password: '{{ index . "valkey-password" }}'
        CONN_STR: 'redis://:{{ index . "valkey-password" }}@gitea-valkey-primary.gitea.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s&'
  dataFrom:
    - extract:
        key: apps/gitea/gitea-valkey
