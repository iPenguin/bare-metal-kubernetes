---
global:
  storageClass: "ceph-block"

image:
  tag: "28.0.0"
  rootless: true

deployment:
  env:
    # Pre-shared runner registration token, consumed by the gitea-actions
    # runner. Created out-of-band by the `gitea` ansible role.
    - name: GITEA_RUNNER_REGISTRATION_TOKEN
      valueFrom:
        secretKeyRef:
          name: gitea-runner-token
          key: token
          optional: true

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
#   # Add the SYS_CHROOT capability on nodes that use the container runtime cri-o.
#   # https://gitea.com/gitea/helm-gitea/issues/161
    add:
      - SYS_CHROOT
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

service:
  http:
    type: ClusterIP
    port: 3000
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
      - IPv4
      - IPv6
  ssh:
    type: ClusterIP
    port: 22
    ipFamilyPolicy: PreferDualStack
    ipFamilies:
      - IPv4
      - IPv6

ingress:
  enabled: true
  className: traefik
  annotations:
    # ssh (port 22) is only exposed on the traefik-ssh LoadBalancer, so git.clt.milco.casa
    # is written to the router by Ansible (dnsmasq.conf.j2) as the traefik-ssh IPs.
    # Any value other than dns-controller makes ExternalDNS skip this ingress.
    external-dns.alpha.kubernetes.io/controller: ansible
  hosts:
    - host: git.clt.milco.casa
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  create: true
  mount: true
  claimName: gitea-shared-storage
  storageClass: cephfs
  size: 10Gi
  accessModes:
    - ReadWriteMany
  annotations:
    helm.sh/resource-policy: keep

# Chart signing is GPG-only; SSH signing is set in gitea.config below.
signing:
  enabled: false
  existingSecret: ""

# SSH commit-signing key from OpenBao kv/apps/gitea/gitea-signing-key.
# ssh-keygen loads the private key next to SIGNING_KEY (the .pub path).
extraVolumes:
  - name: signing-key
    secret:
      secretName: gitea-signing-key
      defaultMode: 0440
      items:
        - key: privateKey
          path: key
        - key: publicKey
          path: key.pub
extraContainerVolumeMounts:
  - name: signing-key
    mountPath: /etc/gitea-signing
    readOnly: true

gitea:
  admin:
    existingSecret: gitea-secrets
  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgresql
          key: password
    # Parent chart bakes valkey.global.valkey.password into queue/session/cache
    # URLs in gitea-inline-config. Leave that password empty and override here.
    - name: GITEA__QUEUE__CONN_STR
      valueFrom:
        secretKeyRef:
          name: gitea-valkey
          key: CONN_STR
    - name: GITEA__SESSION__PROVIDER_CONFIG
      valueFrom:
        secretKeyRef:
          name: gitea-valkey
          key: CONN_STR
    - name: GITEA__CACHE__HOST
      valueFrom:
        secretKeyRef:
          name: gitea-valkey
          key: CONN_STR
    - name: GITEA__REPOSITORY_0X2E_SIGNING__SIGNING_EMAIL
      valueFrom:
        secretKeyRef:
          name: gitea-signing-key
          key: email
  metrics:
    enabled: false
  openid:
    ENABLE_OPENID_SIGNIN: true
    ENABLE_OPENID_SIGNUP: false
  oauth:
    - name: "homelab"
      existingSecret: gitea-secrets
      provider: "openidConnect"
      autoDiscoverUrl: "https://sso.clt.milco.casa/realms/homelab/.well-known/openid-configuration"
      scopes: "email profile openid groups"
      adminGroup: "app-gitea-admins"
      restricted-group: "app-gitea-users"
      groupClaimName: "groups"
  service:
    DISABLE_REGISTRATION: true
    REQUIRE_SIGNIN_VIEW: true
  config:
    APP_NAME: "Milco home code repo"
    RUN_MODE: prod
    server:
      DOMAIN: git.clt.milco.casa
      ROOT_URL: https://git.clt.milco.casa
      SSH_DOMAIN: git.clt.milco.casa
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222
      DISABLE_SSH: false
      OFFLINE_MODE: false
      PROTOCOL: http
    repository.signing:
      SIGNING_FORMAT: ssh
      SIGNING_KEY: /etc/gitea-signing/key.pub
      SIGNING_NAME: MilcoBot
      INITIAL_COMMIT: always
      CRUD_ACTIONS: always
      WIKI: always
      MERGES: always
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: github

  ssh:
    logLevel: "INFO"

valkey-cluster:
  enabled: false
valkey:
  enabled: true
  architecture: standalone
  # Subchart existingSecret; default key is valkey-password if unset.
  # OpenBao: kv/apps/gitea/gitea-valkey. Must set global.valkey.password to
  # empty so the parent chart does not bake its default into gitea-inline-config.
  # additionalConfigFromEnvs supplies the real CONN_STR.
  global:
    valkey:
      password: ""
  auth:
    existingSecret: gitea-valkey
    existingSecretPasswordKey: valkey-password
  master:
    count: 1

postgresql-ha:
  enabled: false
postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        existingSecret: gitea-postgresql
        database: gitea
        username: gitea
      service:
        ports:
          postgresql: 5432
  primary:
    persistence:
      size: 5Gi

extraDeploy:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRouteTCP
    metadata:
      name: ssh-route
    spec:
      entryPoints:
        - ssh
      routes:
        - match: HostSNI(`*`)
          services:
            - name: gitea-ssh
              port: 22
