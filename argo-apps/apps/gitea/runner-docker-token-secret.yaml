# Registration token for the gitea-actions-docker runner
# (actions-docker-values.yaml). Org-scoped: homelab org > Settings > Actions >
# Runners > Create new runner. Store it in OpenBao as
# kv/apps/gitea/gitea-runner-docker-token, key `token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-docker-token
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-runner-docker-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/gitea/gitea-runner-docker-token
