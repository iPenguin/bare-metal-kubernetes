---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/harbor/harbor-secrets
