---
# Store for test apps (docs/apps.md, "Test apps"). Only *-testing namespaces.
# serviceAccountRef has no namespace, so ESO requests a token for the
# `openbao-eso` ServiceAccount in the ExternalSecret's own namespace. OpenBao
# role `eso-testing` (openbao-cluster-init.yaml) only reads
# kv/apps/<that namespace>/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-testing
spec:
  conditions:
    - namespaceRegexes:
        - '^.+-testing$'
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-testing
          serviceAccountRef:
            name: openbao-eso
