---
# Cluster-wide ExternalSecrets store backed by the in-cluster OpenBao.
# Secrets live at kv/apps/<namespace>/<secret-name>. The `eso` role and
# policy are created by openbao-cluster-init.yaml.
# Not usable from *-testing namespaces; test apps use `openbao-testing`
# (cluster-secret-store-testing.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  # Conditions are allow-lists and Go regexp has no lookahead, so this regex
  # spells out "any namespace name that does not end in -testing".
  conditions:
    - namespaceRegexes:
        - '^(.{0,7}|.*([^-].{7}|-[^t].{6}|-t[^e].{5}|-te[^s].{4}|-tes[^t].{3}|-test[^i].{2}|-testi[^n].|-testin[^g]))$'
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
