---
# Cluster-wide ExternalSecrets store backed by the in-cluster OpenBao.
# Secrets live at kv/apps/<namespace>/<secret-name>. The `eso` role and
# policy are created by openbao-cluster-init.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
