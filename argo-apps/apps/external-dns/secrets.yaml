---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-secrets
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-dns-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/external-dns/external-dns-secrets
