---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/nextcloud/nextcloud-secrets
