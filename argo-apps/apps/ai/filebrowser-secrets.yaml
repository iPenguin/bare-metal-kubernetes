---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filebrowser-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/ai/filebrowser-secrets
