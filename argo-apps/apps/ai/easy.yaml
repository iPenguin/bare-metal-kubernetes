apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: easy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                - "true"
      containers:
      - command:
        - /bin/bash
        - /opt/ai-init/easy.sh
        env:
        - name: HOME
          value: /srv/ai
        - name: APP_DIR
          value: /srv/ai/easy
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        image: docker.io/ipenguin/ubuntu-24.04-cuda:v1.0.10
        imagePullPolicy: IfNotPresent
        name: primary
        ports:
        - containerPort: 9000
          protocol: TCP
        # first start downloads the installer, python env and models; allow up to an hour
        startupProbe:
          httpGet:
            path: /
            port: 9000
          periodSeconds: 30
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /
            port: 9000
          periodSeconds: 30
        resources:
          limits:
            memory: 48Gi
            nvidia.com/gpu: 1
          requests:
            memory: 1Gi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /srv
          name: srv
        - mountPath: /opt/ai-init
          name: ai-init
          readOnly: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
      volumes:
      - name: srv
        persistentVolumeClaim:
          claimName: ai-applications
      - configMap:
          name: ai-init-scripts-29fb5g68ct
          defaultMode: 0755
        name: ai-init
