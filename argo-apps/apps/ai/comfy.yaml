---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-applications
spec:
  storageClassName: cephfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfy
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfy
    spec:
      runtimeClassName: nvidia
      # always on the best gpu (labelled by the nvidia ansible role)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: clt.milco.casa/gpu-best
                operator: In
                values:
                - "true"
      containers:
      - command:
        - /bin/bash
        - /opt/ai-init/comfy.sh
        env:
        - name: HOME
          value: /srv/ai
        - name: APP_DIR
          value: /srv/ai/comfy
        - name: COMFY_VERSION
          value: v0.39.2
        # extra flags for main.py, e.g. "--lowvram --reserve-vram 2 --disable-dynamic-vram"
        # (--extra-model-paths-config is always passed). One-off without a commit:
        #   kubectl -n ai set env deploy/comfy COMFY_EXTRA_ARGS="--lowvram --reserve-vram 2"
        - name: COMFY_EXTRA_ARGS
          value: ""
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        image: harbor.clt.milco.casa/homelab/ai-base:latest
        imagePullPolicy: Always
        name: primary
        ports:
        - containerPort: 8188
          protocol: TCP
        # first start (or a version bump) downloads python, torch and requirements; allow up to an hour
        startupProbe:
          httpGet:
            path: /
            port: 8188
          periodSeconds: 30
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /
            port: 8188
          periodSeconds: 30
        resources:
          limits:
            memory: 72Gi
            nvidia.com/gpu: 1
          requests:
            memory: 1Gi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /srv
          name: srv
        - mountPath: /opt/ai-init
          name: ai-init
          readOnly: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
      volumes:
      - name: srv
        persistentVolumeClaim:
          claimName: ai-applications
      - configMap:
          name: ai-init-scripts
          defaultMode: 0755
        name: ai-init
