---
ollama:
  enabled: true
  ollama:
    # adds the nvidia.com/gpu limit and the nvidia.com/gpu toleration to the ollama pod
    gpu:
      enabled: true
      type: 'nvidia'
      number: 1
    models:
      pull:
        - llama3
        - mistral
        - qwen3:8b
      run:
        - llama3
  # same standard as comfy/easy: the nvidia runtime injects the driver libraries
  runtimeClassName: nvidia
  extraEnv:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  # always on the slowest gpu (labelled by the nvidia ansible role), leaving the fast ones for image gen
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: clt.milco.casa/gpu-slowest
            operator: In
            values:
            - "true"
  resources:
    limits:
      memory: 16Gi
    requests:
      memory: 1Gi
  persistentVolume:
    enabled: true
    size: 100Gi

websocket:
  enabled: true
  manager: redis
  redis:
    enabled: true
    name: open-webui-redis
    image:
      repository: redis
      tag: 7.4.2-alpine3.21
      pullPolicy: IfNotPresent
    service:
      containerPort: 6379
      type: ClusterIP
      port: 6379

pipelines:
  enabled: true

# Enable internal PostgreSQL using Bitnami subchart
postgresql:
  enabled: true
  fullnameOverride: open-webui-postgres
  architecture: standalone

  auth:
    database: open-webui
    username: open-webui
    existingSecret: open-webui-secrets
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: user-password
      replicationPasswordKey: replication-password

  primary:
    persistence:
      enabled: true
      size: 5Gi

    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 1Gi

    pgHbaConfiguration: |
      local all all trust
      host all all 127.0.0.1/32 trust
      host all all ::1/128 trust
      host all all 0.0.0.0/0 md5

    configuration: |
      max_connections = 100
      shared_buffers = 128MB
      effective_cache_size = 512MB
      maintenance_work_mem = 64MB

service:
  type: ClusterIP
  port: 8080

# the chart's service has no ipFamilies option, so ingress.yaml has a dual-stack open-webui
# service and the ingress for ai.clt.milco.casa instead
ingress:
  enabled: false

# start.sh hands extra args to uvicorn after its own --host 0.0.0.0 (IPv4 only); the later empty
# --host wins and binds both 0.0.0.0 and [::]. Passing args replaces start.sh's default
# --workers/--ws-per-message-deflate, so they're repeated here.
args:
  - bash
  - start.sh
  - --host
  - ""
  - --workers
  - "1"
  - --ws-per-message-deflate
  - "true"

resources:
  limits:
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  provider: local
  storageClass: "ceph-block"

# OLLAMA_BASE_URLS is set by the chart to point at the bundled ollama service
extraEnvVars:
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: secret-key
  - name: WEBUI_AUTH
    value: "true"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - "w4.clt.milco.casa"

sso:
  enabled: true
  enableSignup: false
  mergeAccountsByEmail: false
  enableRoleManagement: false
  enableGroupManagement: false

  oidc:
    enabled: true
    clientId: open-webui
    clientExistingSecret: open-webui-secrets
    clientExistingSecretKey: client-secret
    providerUrl: "https://sso.clt.milco.casa"
    providerName: "homeLab"
    scopes: "openid email profile groups"

  roleManagement:
    rolesClaim: "roles"
    allowedRoles: ""
    adminRoles: ""

  groupManagement:
    groupsClaim: "groups"
