---
apiVersion: v1
kind: Service
metadata:
  name: plex-share
  annotations:
    metallb.io/loadBalancerIPs: placeholder
    external-dns.alpha.kubernetes.io/hostname: plex-svc.clt.milco.casa
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  selector:
    app: plex-media-server
  ports:
    - name: plex
      port: 32400
      targetPort: 32400
