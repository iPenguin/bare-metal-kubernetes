---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-secrets
  namespace: plex
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: plex-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/plex/plex-secrets
