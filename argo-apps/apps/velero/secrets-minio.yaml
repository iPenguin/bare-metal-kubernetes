---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-minio-secrets
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-minio-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/velero/velero-minio-secrets
