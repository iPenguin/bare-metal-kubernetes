---
credentials:
  useSecret: true
  existingSecret: velero-minio-secrets

serviceAccount:
  server:
    create: true
    name: velero

configuration:
  backupStorageLocation:
    - name: local
      provider: aws
      bucket: velero-backups
      default: true
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: https://minio-local.clt.milco.casa
    - name: backblaze
      provider: aws
      bucket: milco-cluster-backups
      prefix: velero
      config:
        region: us-west-002
        s3ForcePathStyle: true
        s3Url: https://s3.us-west-002.backblazeb2.com
      credential:
        name: velero-backblaze-secrets
        key: cloud

  # Explicitly disable VolumeSnapshotLocation if not needed
  volumeSnapshotLocation: []

deployNodeAgent: true
nodeAgent:
  # node-agent must run on every node for fs backups, including the tainted GPU nodes
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# Disable the chart's CRD-upgrade hook Job; it was unreliable (Bitnami image
# deprecation, distroless shell, SA token 401). Argo still applies the chart's
# crds/ directory on sync.
upgradeCRDs: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    volumeMounts:
      - mountPath: /target
        name: plugins

schedules:
  local-backups:
    schedule: "0 0 * * *"
    template:
      ttl: 720h  # 30 days
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - minio
        - velero
      includedResources:
        - "*"
      defaultVolumesToFsBackup: true
      includeClusterResources: true
      storageLocation: local
  offsite-backups:
    schedule: "0 3 * * 0"  # weekly, Sundays 03:00
    template:
      ttl: 8760h  # 1 year
      includedNamespaces:
        - cert-manager
        - gitea
        - keycloak
        - lldap
        - nextcloud
        - openbao
        - rook-ceph
      includedResources:
        - "*"
      defaultVolumesToFsBackup: true
      includeClusterResources: true
      storageLocation: backblaze

image:
  repository: velero/velero
  tag: v1.18.4
