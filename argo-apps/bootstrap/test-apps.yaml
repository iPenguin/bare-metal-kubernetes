---
# Side-project test deploys from the Gitea org `homelab` (docs/apps.md, "Test apps").
# Argo clones over HTTPS; the SSH form is allowed so human-style URLs also validate.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: test-apps
  namespace: argocd
spec:
  description: Side-project test deploys from Gitea org homelab
  sourceRepos:
    - https://git.clt.milco.casa/homelab/*
    - git@git.clt.milco.casa:homelab/*
  destinations:
    - namespace: '*-testing'
      server: https://kubernetes.default.svc
  # Only the app's own Namespace (CreateNamespace=true); nothing else cluster-scoped.
  # name uses Go filepath.Match; *-testing covers any <id>-testing namespace.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
      name: '*-testing'
  # Keep test apps out of other stores, RBAC, hand-written endpoints, and
  # routing other than a plain Ingress (ValidatingAdmissionPolicy
  # testing-ingresses limits its host). ClusterSecretStore is cluster-scoped,
  # so the whitelist above already blocks it. Traefik v3 no longer serves
  # traefik.containo.us; listed in case it comes back.
  namespaceResourceBlacklist:
    - group: external-secrets.io
      kind: SecretStore
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ''
      kind: Endpoints
    - group: discovery.k8s.io
      kind: EndpointSlice
    - group: traefik.io
      kind: '*'
    - group: traefik.containo.us
      kind: '*'
    - group: gateway.networking.k8s.io
      kind: '*'
    - group: cilium.io
      kind: '*'
