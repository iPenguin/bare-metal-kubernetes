---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: plex
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Only plex-svc is reserved in network_services and published as a
    # dnsmasq host-record. plex.clt.milco.casa comes from the Ingress via
    # ExternalDNS (Traefik), so digging it here was a chicken-and-egg that
    # left this ApplicationSet generating no Application.
    - plugin:
        configMapRef:
          name: dig
        input:
          parameters:
            hostname: plex-svc.clt.milco.casa
  template:
    metadata:
      name: plex
    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - Confirm=true
      project: plex
      destination:
        namespace: plex
        server: https://kubernetes.default.svc
      sources:
        - repoURL: https://github.com/ipenguin/bare-metal-kubernetes.git
          targetRevision: master
          path: argo-apps/apps/plex
          kustomize:
            patches:
              - target:
                  kind: Service
                  name: "plex-share"
                patch: |-
                  - op: replace
                    path: /metadata/annotations/metallb.io~1loadBalancerIPs
                    value: {{ .ipv4_address }},{{ .ipv6_address }}
        - repoURL: https://github.com/ipenguin/bare-metal-kubernetes.git
          targetRevision: master
          ref: valuesSrc
        - repoURL: 'https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages'
          chart: plex-media-server
          targetRevision: 1.9.0
          helm:
            valueFiles:
              - '$valuesSrc/argo-apps/apps/plex/values.yaml'
            values: |-
              extraEnv:
                ADVERTISE_IP: "https://plex.clt.milco.casa:443,http://{{ .ipv4_address }}:32400,http://[{{ .ipv6_address }}]:32400"
