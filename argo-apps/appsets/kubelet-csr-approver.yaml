---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubelet-csr-approver
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: kubelet-csr-approver
    spec:
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
      project: kubelet-csr-approver
      destination:
        namespace: kubelet-csr-approver
        server: https://kubernetes.default.svc
      sources:
        - repoURL: 'https://postfinance.github.io/kubelet-csr-approver'
          chart: kubelet-csr-approver
          targetRevision: 1.2.15
          helm:
            valueFiles:
              - '$valuesSrc/argo-apps/apps/kubelet-csr-approver/values.yaml'
        - repoURL: https://github.com/ipenguin/bare-metal-kubernetes.git
          targetRevision: master
          ref: valuesSrc
